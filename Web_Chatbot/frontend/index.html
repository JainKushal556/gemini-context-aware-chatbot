<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div id="app">
        <!-- Header -->
        <div id="chat-header">
            <img id="avatar" src="Resources/kimi_avatar.jpg" alt="Kimi" />
            <div id="header-info">
                <span id="bot-name">Kimi</span>
                <span id="bot-status">Online</span>
            </div>
        </div>

        <!-- Mode Toggle Buttons -->
        <div id="mode-toggle">
            <button class="mode-btn active" id="btn-stateless" onclick="setMode('stateless')">⚡ No Memory</button>
            <button class="mode-btn" id="btn-stateful" onclick="setMode('stateful')">🧠 With Memory</button>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-box"></div>

        <!-- Input Area -->
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Message Kimi..." autocomplete="off" />
            <button id="send-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
